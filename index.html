<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ödev Takip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="kapsayici">
    <header>
      <h1>Ödev Takip</h1>
    </header>

    <!-- Ödev ekleme formu -->
    <section class="kart">
      <h2>Yeni Ödev</h2>
      <form id="odev-formu" novalidate>
        <div class="alan">
          <label for="odev-adi">Ödev adı</label>
          <input type="text" id="odev-adi" placeholder="Örn. Proje raporu">
        </div>
        <div class="alan">
          <label for="ders-adi">Ders adı</label>
          <input type="text" id="ders-adi" placeholder="Örn. Web Programlama">
        </div>
        <div class="alan">
          <label for="teslim-tarihi">Teslim tarihi</label>
          <input type="date" id="teslim-tarihi">
        </div>
        <button type="submit">Ekle</button>
        <p id="form-mesaji" class="form-mesaji" aria-live="polite"></p>
      </form>
    </section>

    <!-- Ödev listesi -->
    <section class="kart">
      <h2>Ödevlerim</h2>

      <!-- Filtreleme ve sıralama seçenekleri -->
      <div class="filtreler">
        <div class="filtre">
          <label for="ders-filtresi">Ders</label>
          <select id="ders-filtresi">
            <option value="">Tüm dersler</option>
          </select>
        </div>
        <div class="filtre">
          <label for="siralama">Sırala</label>
          <select id="siralama">
            <option value="eklenme">Eklenme sırası</option>
            <option value="tarih">Teslim tarihi (en yakın önce)</option>
          </select>
        </div>
        <label class="filtre-kutu">
          <input type="checkbox" id="sadece-tamamlanmamis">
          Sadece tamamlanmamışlar
        </label>
      </div>

      <ul id="odev-listesi"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
